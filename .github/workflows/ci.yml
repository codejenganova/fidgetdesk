name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -trimpath -o ${{ runner.temp }}/fidgetdesk${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/fidgetdesk
