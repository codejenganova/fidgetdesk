name: Feature request
description: Suggest an idea for FidgetDesk.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation. For example, "When a client calls me I have no quick way to ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: who
    attributes:
      label: Who are you using FidgetDesk as?
      options:
        - Solo IT tech with several clients
        - Homelabber
        - Go-to tech person for family, friends, or a building
        - Other
