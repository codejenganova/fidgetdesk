name: Bug report
description: Something isn't working the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **remove any client names, passwords, or other private details** before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start fidgetdesk with ...
        2. Click ...
        3. See error ...
  - type: input
    id: version
    attributes:
      label: FidgetDesk version
      description: Run `fidgetdesk -version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any errors printed in the terminal (scrub private details first).
      render: text
